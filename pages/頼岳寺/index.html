    <p class="description">
        少林山 頼岳寺(らいがくじ)は寛永8年(1631)に開創された曹洞宗の寺院。開基は高島藩初代藩主の諏訪頼水。
    </p>

    <p>
        <a href="/pages/上原五山/">上原五山</a>第一位、永明寺の後継寺。
    </p>
