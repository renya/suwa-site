    <p class="description">
        小坂鎮守神社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/下十三所/">下十三所</a>の一社。
        <a href="/pages/岡谷市/">岡谷市</a>に鎮座。
        小坂地区の産土神。
        御祭神は下照姫命。建御名方命の姉神とされます。
    </p>

    <p>
        小野鎮守明神と佐久新海明神が湖中にて参会すると、佐久の御神渡りができると伝えられています。
    </p>
