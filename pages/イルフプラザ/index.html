    <p class="description">
        イルフプラザは市街地再開発事業で作られた商業施設。
        1997年9月26日にながの東急百貨店の子会社のおかや東急百貨店を核店舗に開業。
        2002年4月30日でおかや東急百貨店は閉店。
        岡谷市が建物を取得し、整備を行う。
        近隣のカネジョウが本店を移転し、新たな核店舗となっている。
    </p>
