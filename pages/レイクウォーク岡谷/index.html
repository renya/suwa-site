    <p class="description">
        レイクウォーク岡谷は2014年8月に閉店したアピタ岡谷の跡地に2016年にオープンした複合商業施設。
        核店舗はアピタ岡谷店。
    </p>

    <p>
        昭和60年(1985)にビアアピタ岡谷として開業。
        アピス岡谷を併設し、夏はプール、冬はスケートリンクとして営業。
        平成4年(1992)にアピス岡谷は閉鎖。
    </p>
