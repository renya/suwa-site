    <p class="description">
        上金子 御頭御社宮司社 (南方北方合祀)は諏訪大社の摂社。社格は村社。
        祭神は御社宮司社神、諏訪大社建御名方富命御子神合祀。
    </p>

    <p>
        自然信仰に基づく稲、土地の神を崇めてきたところ、7世紀初頭からは建御名方富命という人格神も祀られるようになる。
        明治維新後、北方の御頭御社宮司社が南方に統合される。
    </p>
