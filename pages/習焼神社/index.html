    <p class="description">
        習焼神社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/中十三所/">中十三所</a>の一社(第5番)。
        御祭神は洲羽若彦命(すわわかひこのみこと)、素盞嗚命(すさのおのみこと)、草薙剣徳(くさなぎのつるぎのとく)の三柱。
        真志野地郷の産土神。
    </p>

    <p>
      古くは野明神社、野明明神などと呼ばれ、野焼・野炎とも表記されました。
      かつては境内も広く、流鏑馬などの射礼が行われた場所と伝えられています。境内に残る流鏑馬社の小祠や真弓塚は、その名残とされています。
      4月22日に例祭が斎行されます。
    </p>
