    <h1>蓼科湖</h1>

    <div class="tags">
      <a class="tag" href="https://shimosuwa.info/pages/スポット/">スポット</a>
    </div>

    <p class="description">
        蓼科湖は昭和27年5月、農業用の温水ため池として、また<a href="/pages/蓼科高原/">蓼科高原</a>の観光資源として造られた人造湖です。
        <a href="/pages/ビーナスライン/">ビーナスライン</a>沿いにあり、
        周囲約1.1kmが遊歩道として整備されています。
    </p>

    <p>
        湖畔には<a href="/pages/道の駅_ビーナスライン蓼科湖/">道の駅 ビーナスライン蓼科湖</a>があります。
        隣接して<a href="/pages/蓼科BASE/">蓼科BASE</a>などがあります。
        そのビーナスラインを挟んだ向かいには<a href="/pages/8Peaks_BREWING/">8Peaks BREWING</a>の工場兼直営店があります。
    </p>
