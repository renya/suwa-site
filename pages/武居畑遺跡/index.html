    <p class="description">
        諏訪市中洲神宮寺にある、縄文時代から中世にかけての集落遺跡。断層によって形成された平坦な丘陵上に広がり、諏訪市内最大の集落遺跡といわれています。縄文時代前期の土器や石器、古墳時代の土師器などが出土しています。
    </p>

    <p>
        上社の杜 歴史の散歩道沿いにあります。
    </p>
