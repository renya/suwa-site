    <p class="description">
        井戸尻考古館は、<a href="/pages/富士見町/">富士見町</a>にある縄文時代の考古資料を展示する施設です。井戸尻遺跡群から出土した土器や土偶などを通じて、八ヶ岳山麓の縄文文化を紹介しています。
