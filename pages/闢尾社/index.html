    <p class="description">
        闢尾社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/中十三所/">中十三所</a>の一社。
        祭神は保食神。
        秋尾、秋庵、秋穂、闢庵、闢廬などとも書かれる。読み方は全てアキホです。
    </p>

    <p>
        原村指定史跡。昭和58年8月30日指定。
        例祭は御射山社祭1日目に上り祭として上社からの御射山社祭神の一つである大元尊神(国常立命)の神輿が立ち寄り、行われます。
        現在の社殿は昭和55年(1980)に諏訪大社下社の宝殿を移築したもので、中には明治41年(1908)に平林勝四郎によって建てられた神殿が入っています。
    </p>
