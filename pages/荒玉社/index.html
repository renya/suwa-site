    <p class="description">
        荒玉社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/上十三所/">上十三所</a>の一社。
        稲作・農耕に関わる祭祀の場です。
        新御魂社とも書きます。
        現在は<a href="/pages/前宮/">前宮</a>の参拝者駐車場の中にあります。
    </p>

    <p>
      古来、正月元日には大祝以下の神官・氏人が参詣し、旧暦2月晦日の春祭では神使が出仕して「野出の神事」が行われていました。
      社の造営は古くから山浦の中村郷(現在の茅野市湖東にある中村地区)が担っていたとされています。
    </p>
