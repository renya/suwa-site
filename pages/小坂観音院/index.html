    <h1>小坂観音院</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

<div class="meta">
  <div><span>住所:</span> <a href="/pages/岡谷市/">岡谷市</a>湊4-15-22</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/suwa6.html?lat=36.03520817094469&lng=138.06875244364002&zoom=16&name=小坂観音院" class="map-link" target="_blank">開く</a></div>

    <p class="description">
        小坂観音院は正式には龍光山 観音院といい、真言宗智山派の寺院です。
        本尊は十一面観世音。伝承によると諏訪湖から漁夫の網にかかって引き上げられたと言われています。
        境内には湖衣姫・由布姫の供養塔があります。
        あじさいの名所としても知られています。
    </p>

    <p>
        古くは<a href="/pages/諏訪大社/">諏訪大社</a>上社の社坊、中世は諏訪藩の祈願所でした。
        明治4年(1871)に真義真言宗醍醐派から昌福寺の末寺として観音院の院号が与えられ、
        明治44年(1911)に真言宗智山派の公称寺院となりました。
    </p>
