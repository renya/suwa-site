    <h1>井戸尻遺跡群</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

    <p class="description">
        井戸尻遺跡群は、<a href="/pages/富士見町/">富士見町</a>にある縄文時代中期の集落遺跡で、昭和41年(1966)に国の史跡に指定されています。2025年9月18日に<a href="/pages/曽利遺跡/">曽利遺跡</a>が追加指定され、<a href="/pages/井戸尻遺跡/">井戸尻遺跡</a>と<a href="/pages/曽利遺跡/">曽利遺跡</a>からなる遺跡群となりました。八ヶ岳南麓の縄文文化を代表する遺跡群です。出土品は主に<a href="/pages/井戸尻考古館/">井戸尻考古館</a>で保管・展示が行われています。
    </p>
