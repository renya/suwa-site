    <h1>諏訪市</h1>

   <a class="tag" href="https://shimosuwa.info/pages/文化/">文化</a>

    <!-- このページ内容に関する説明 -->
    <p class="description">
        信州・諏訪市は<a href="https://shimosuwa.info/pages/諏訪湖/">諏訪湖</a>の東岸から南岸にかけて広がる市です。<a href="https://shimosuwa.info/pages/諏訪大社/">諏訪大社</a>上社本宮が鎮座します。また、<a href="/pages/霧ヶ峰/">霧ヶ峰</a>などの高原エリアもあります。
    </p>

    <p>
        昭和16年(1941)8月10日に上諏訪町、四賀村、豊田村が合併し市制施行。昭和30年(1955)4月1日に中洲村と湖南村が合併。
    </p>
