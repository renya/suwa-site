    <h1>藤内遺跡</h1>

 <div class="tags">

 </div>

<div class="meta">
  <div><span>住所:</span> <a href="/pages/富士見町/">富士見町</a>落合3722-25</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/suwa6.html?lat=35.890674629836035&lng=138.2747200878093&zoom=16&name=藤内遺跡&points=map-data.js&type=jomon" class="map-link" target="_blank">開く</a></div>

    <p class="description">
        藤内(とうない)遺跡は、「有孔鍔付土器」や「神像筒形土器」が見つかった縄文時代の集落遺跡。
        町指定史跡。
        広義の井戸尻遺跡群に含まれます。
        出土品の多くは<a href="/pages/井戸尻考古館/">井戸尻考古館</a>に収蔵・展示されています。
    </p>

    <p>
        32号住居址は現在は民家の下となっています。
        令和2年(2020)から公有化が進められています。
        令和6年(2024)度より富士見町文化財係により範囲内容確認調査が実施されています。
        令和7年(2025)3月には現地案内板が設置されました。
    </p>
