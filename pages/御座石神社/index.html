    <p class="description">
        御座石神社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/中十三所/">中十三所</a>の一社。
        祭神は建御名方命の母神である高志沼河姫命(こしぬなかわひめのみこと)です。
        毎年4月27日のどぶろく祭(矢ヶ崎祭)でも有名です。
    </p>
