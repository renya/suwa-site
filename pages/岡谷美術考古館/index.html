    <h1>岡谷美術考古館</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>

    <p class="description">
        岡谷市立岡谷美術考古館は、岡谷ゆかりの美術作品や考古資料を展示・紹介しています。
    </p>

    <p>
      1970年に岡谷市立岡谷蚕糸博物館に併設する形で開館。
      2013年に現在地に移転・リニューアル開館。
      1Fは受付、ショップ、交流エリア。
      2Fに考古室と美術室があります。
      考古室には縄文時代から平安時代までの出土品が時代順に整理されて展示されています。
    </p>
