    <h1>岡谷美術考古館</h1>

 <div class="tags">

    <p class="description">
        岡谷市立岡谷美術考古館は、岡谷ゆかりの美術作品や考古資料を展示・紹介しています。
    </p>

    <p>
      1970年に岡谷市立岡谷蚕糸博物館に併設する形で開館。
      2013年に現在地に移転・リニューアル開館。
    </p>

    <p>
      ここには<a href="/pages/三十三番中部土偶札所巡り/">三十三番中部土偶札所巡り</a>の内、十六番の「壺を持つ妊娠土偶」、十七番の「超小型土偶」があります。
    </p>
