    <p class="description">
        神宮寺足湯は<a href="/pages/諏訪大社/">諏訪大社</a>上社<a href="/pages/本宮/">本宮</a>前にある諏訪市博物館の敷地内にある足湯。
        博物館の開館時間であれば、誰でも無料で使う事が出来ます。
    </p>

    <p>
        神宮寺温泉管理組合から供給を受けた神宮寺混合泉。
        平成16年(2004)3月開設。令和6年(2024)5月にリニューアル。
        諏訪と温泉として湯玉伝説を書いた額が掲げられています。
    </p>
