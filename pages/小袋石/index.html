        小袋石は諏訪七石の一つ。
        磐座。
        <a href="/pages/茅野市/">茅野市</a>宮川高部の山中にある巨石で、別名「舟つなぎ石」とも呼ばれます。<a href="/pages/磯並社/">磯並社</a>、瀬神社、穂股社、<a href="/pages/玉尾社/">玉尾社</a>を経た先にあり、磯並社群とともに古くからの祭祀の場とされています。
