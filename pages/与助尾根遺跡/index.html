    <h1>与助尾根遺跡</h1>

 <div class="tags">

 </div>

<div class="meta">
  <div><span>住所:</span> 茅野市豊平南大塩</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/suwa6.html?lat=36.01424836458714&lng=138.23371838937584&zoom=16&name=与助尾根遺跡" class="map-link" target="_blank">開く</a></div>

    <p class="description">
        <a href="/pages/尖石縄文考古館/">尖石縄文考古館</a>の脇にある与助尾根遺跡は
        宮坂英弌氏により昭和21年(1946)から昭和26年(1952)までに28軒の穴住居を発掘されました。
        竪穴住居が復元されています。
        平成5年(1993)に<a href="/pages/尖石遺跡/">特別史跡 尖石石器時代遺跡</a>に追加指定されました。
    </p>
