    <p class="description">
        泰平山 安國禅寺は臨済宗妙心寺派の寺院。
        安国寺は征夷大将軍足利尊氏が全国六十六ヶ国に一寺一塔の造立した寺院。
        信濃国は幕府奉行人の諏訪円忠の働きによって前宮近くに建立されました。
    </p>

    <p>
        諏訪霊場百番札所 中十九番 准胝観世音菩薩の寺院です。
    </p>
