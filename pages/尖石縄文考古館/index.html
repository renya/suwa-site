    <h1>尖石縄文考古館</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

<div class="meta">
  <div><span>住所:</span> 茅野市豊平4734-132</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/suwa6.html?lat=36.01351065781559&lng=138.23433027800306&zoom=16&name=小野神社" class="map-link" target="_blank">開く</a></div>

    <p class="description">
        尖石遺跡に隣接する縄文文化の博物館。国宝「縄文のビーナス」や「仮面の女神」をはじめ、八ヶ岳西麓の縄文遺跡から出土した土器や土偶などを展示しています。
    </p>

    <div class="gallery">
<figure>
  <a href="https://i.suwa.info/p/spot/togariishi-1.jpg" target="_blank"><img src="https://i.suwa.info/p/spot/togariishi-1.jpg" alt=""></a>
  <figcaption>
    正面入口
    <small></small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/spot/togariishi-2-jhomon.jpg" target="_blank"><img src="https://i.suwa.info/p/spot/togariishi-2-jhomon.jpg" alt=""></a>
  <figcaption>
    縄文のビーナスは国宝指定の土偶。昭和61年(1986)9月8日に茅野市米沢の棚畑遺跡より発掘。約5000年前、縄文時代中期前半の品。平成7年(1995)6月15日に国宝に指定。
    <small></small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/spot/togariishi-3-kamen.jpg" target="_blank"><img src="https://i.suwa.info/p/spot/togariishi-3-kamen.jpg" alt=""></a>
  <figcaption>
    仮面のビーナスは国宝指定の土偶。平成12年(2000)8月23日に茅野市湖東の中ツ原遺跡より発掘。約4000年前、縄文時代後期の品。平成26年(2014)8月21日に国宝に指定。
    <small></small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/spot/togariishi-4-kokuhodoki.jpg" target="_blank"><img src="https://i.suwa.info/p/spot/togariishi-4-kokuhodoki.jpg" alt=""></a>
  <figcaption>
    仮面のビーナスの近くから出土した浅鉢形土器。附として8点が国宝指定されています。
