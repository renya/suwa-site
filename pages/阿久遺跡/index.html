    <p class="description">
        阿久遺跡は縄文時代の遺跡。
        中央自動車道の建設に伴い昭和50年から53年にかけて発掘調査が行われ、現在は中央道下に砂で埋められ保存されています。
        昭和54年(1979)7月2日に国の史跡に指定されています。
    </p>
