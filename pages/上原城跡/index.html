    <h1>上原城跡</h1>

 <div class="tags">

    <p class="description">
        上原城跡は中世の山城。諏訪総領家5代70年の本拠。諏訪総領家滅亡後は武田氏による諏訪地方支配40年の拠点。
    </p>

    <p>
        北西に桑原城を支城に抱えています。
        昭和46年5月27日に長野県史跡に指定されています。
    </p>
