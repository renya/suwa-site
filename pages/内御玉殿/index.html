    <p class="description">
        内御玉殿は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/上十三所/">上十三所</a>の一社。
        御神宝が安置されていた御殿。現在の社殿は昭和7年に改築された物。それ以前は天正13年に造営された上社関係で最古の建造物だった。
        <a href="/pages/茅野市/">茅野市</a>宮川に鎮座。現在は<a href="/pages/前宮/">前宮</a>の境内にあります。
    </p>
