    <p class="description">
        <!-- 達屋神社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の摂社。<a href="/pages/下十三所/">下十三所</a>の一社。
         ⇒としていましたが、下記由来からそうではないと考えました。下十三所の達屋神社は横内にあった今の達屋酢蔵神社を指す可能性がある。
         中世の記録と新井の案内板から、要確認。 -->
        新井の産土神を祀ります。
        寛政9年(1797)、横内の達屋神社から彦狭知神を勧請し、手置帆負神とともに祀りました。
    </p>
