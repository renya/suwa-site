    <p class="description">
        諏訪頼忠の四男の頼広を祖とする<a href="/pages/大祝/">大祝</a>諏方家の墓所。
        2007年に寄付され、現在は<a href="/pages/諏訪上社旧大祝邸跡/">旧大祝邸跡</a>とともに諏訪市教育委員会が所有・管理しています。
    </p>

    <p>
        この墓所は、<a href="/pages/大祝/">大祝</a>家が宮田渡へ移った頃に設けられたと伝えられています。
        その際、もともとこの場所にあった守矢家の墓地は、熊野堂へ移されたとされています。
        また、明治の神仏分離に伴い、<a href="/pages/頼岳寺/">頼岳寺</a>にあった大祝家の墓も現在地に移されたとされています。
    </p>
