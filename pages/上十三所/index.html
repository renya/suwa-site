    <p class="description">
      上十三所は、<a href="https://shimosuwa.info/pages/諏訪大社/">諏訪大社</a>上社の摂末社のうち、39社を上・<a href="/pages/中十三所/">中</a>・<a href="/pages/下十三所/">下</a>の各十三所に分けたうちの一つ。これら39社のほか、<a href="/pages/本宮/">本宮</a>境内にも<a href="/pages/大國主命社_本宮境内/">大国主社</a>・<a href="/pages/出早社/">出早社</a>・<a href="/pages/高島神社/">高島神社</a>があります。
    </p>

    <p>
