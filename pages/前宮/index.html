    <p>
      明治29年(1896)までは上社<a href="/pages/本宮/">本宮</a>の境外摂社でした。
      <a href="/pages/上十三所/">上十三所</a>の一社でもあります。
      また、<a href="/pages/上十三所/">上十三所</a>の<a href="/pages/所政社/">所政社</a>、<a href="/pages/荒玉社/">荒玉社</a>、<a href="/pages/若御子社/">若御子社</a>、<a href="/pages/柏手社/">柏手社</a>、<a href="/pages/溝上社/">溝上社</a>、
      <a href="/pages/中十三所/">中十三所</a>の<a href="/pages/内御玉殿/">内御玉殿</a>、
      <a href="/pages/下十三所/">下十三所</a>の<a href="/pages/御室社/">御室社</a>
      が境内にあります。
      前宮は、社務所や十間廊のあるエリアと、本殿・御柱のあるエリアの間に道路や民家、畑などがあります。境内の範囲には捉え方もありますが、ここではこれらの社を前宮の境内として扱います。
    </p>
