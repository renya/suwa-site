  <div><span>地図:</span> <a href="https://i.suwa.info/view/suwa6.html?lat=36.05499070478072&lng=137.96957981994603&zoom=16&name=小野神社" class="map-link" target="_blank">開く</a></div>

    <p class="description">
        塩尻市北小野に鎮座する、建御名方命を祀る古社。信濃国二之宮として崇敬され、隣接する<a href="/pages/矢彦神社/">矢彦神社</a>とともに「小野南北大明神」と称されました。<a href="https://shimosuwa.info/pages/諏訪大社/">諏訪大社</a>と同じ祭神を祀り、御柱祭も諏訪大社の翌年に行われます。
    </p>
