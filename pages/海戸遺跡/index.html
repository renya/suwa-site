    <p class="description">
        海戸遺跡は、天竜川河口の諏訪湖に面した高台にある、縄文、弥生、古墳、奈良、平安各時代の遺構が見つかっている遺跡。
        現在は民家などになっており、建て直しの際などに発掘調査が行われています。
        1966年に出土した顔面把手付深鉢形土器は国の重要文化財に指定されています。
    </p>

    <p>
        国指定重要文化財<a href="/pages/岡谷美術考古館/#ganmen">顔面把手付深鉢形土器</a>をはじめ
    </p>
