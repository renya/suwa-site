      標高1955m、富士見パノラマリゾートのゴンドラ山頂駅からはおよそ1時間で山頂まで行くことが出来ます。途中に山小屋などもあり、そこまではハイキング感覚で歩く事が出来ます。
    </p>

    <p>
      2026年10月12日午前中のハイキングの際の写真達です。
      山頂からは秋晴れの中、360度見渡せました。
      蓼科山を含めた八ヶ岳、富士山、諏訪湖、南アルプスの4枚です。
    </p>
