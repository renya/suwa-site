    <p class="description">
        大年社は<a href="/pages/諏訪大社/">諏訪大社</a>上社の末社。<a href="/pages/上十三所/">上十三所</a>の一社。
        祭神は大歳神。
    </p>

    <p>
      古くは神田五段を持ち、大祝の即位に際して行われた十三所参では12番目に参詣する社でした。
      <a href="/pages/御座石神社/">御座石神社</a>のどぶろく祭り(矢ヶ崎祭)にも関係し、祭礼当日には大年社でも神祭が行われます。
      御柱は建てず、七年ごとに素朴な鳥居を建てる習わしがあります。
    </p>
