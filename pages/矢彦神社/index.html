    <p class="description">
        辰野町の飛び地である塩尻市北小野の一角に鎮座する古社。信濃国二之宮として崇敬され、隣接する<a href="/pages/小野神社/">小野神社</a>とともに「小野南北大明神」と称されました。御柱祭も行われています。
