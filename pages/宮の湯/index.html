    <p class="description">
        天下の名湯 宮の湯は<a href="https://shimosuwa.info/pages/諏訪大社/">諏訪大社</a>上社<a href="/pages/本宮/">本宮</a>から五乃鳥居を抜けた先にある共同浴場。
    </p>

    <p>
        主浴槽は泉温63度の神宮寺温泉(第1源湯、第2源湯、第3源湯の混合泉)の塩化物泉と冷鉱泉の硫黄泉の混合泉のかけ流し。
        副浴槽は独自源泉の泉温28度の冷鉱泉の硫黄泉のかけ流しのいわば水風呂。
    </p>
